[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "max-token-retrieval"
version = "0.14.1"
description = "Stop paying for tokens you never use — measure and maximize your AI subscription token utilization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Philbert Christian" }]
keywords = ["claude", "llm", "tokens", "utilization", "llmops", "aiops"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/PhilbertChristian/goldenclaw"

[project.optional-dependencies]
agent = ["claude-agent-sdk"]

[project.scripts]
goldenclaw = "max.cli:main"
max = "max.cli:max_main"

[tool.hatch.build.targets.wheel]
packages = ["max"]
